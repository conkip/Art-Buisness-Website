<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Creative Canvas</title>
        <link rel="stylesheet" type="text/css" href="./css/all.css" />
        <link rel="stylesheet" type="text/css" href="./css/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/footer.css" />
        <link rel="stylesheet" type="text/css" href="./css/auth.css" />
        <link rel="icon" type="image/png" href="./images/logo.png" />
    </head>

    <!-- Google tag (gtag.js) -->
    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-RL9DJJ4Y2V"
    ></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag("js", new Date());

        gtag("config", "G-RL9DJJ4Y2V");
    </script>

    <body>
        <div id="page-wrapper">
            <div id="nav-container"></div>

            <main id="auth-content">
                <h1 id="auth-title" class="center-text">Welcome</h1>
                <form id="auth-form" class="center-text">
                    <p id="invalid-text" class="center-text" visibility="hidden">.</p>
                    <div>
                        <label for="username">Username:</label>
                        <input
                            id="username"
                            class="auth-input"
                            type="text"
                            name="username"
                            required
                        />
                    </div>

                    <div class="small-spacer"></div>

                    <div id="password-container">
                        <label for="password">Password:</label>
                        <div id="password-input-container">
                            <input
                                id="password"
                                class="auth-input"
                                type="password"
                                name="password"
                                required
                            />
                            <span class="subtext"><input type="checkbox" onclick="showPassword()"> Show Password</span>
                        </div>
                    </div>

                    <div class="small-spacer"></div>

                    <button
                        class="hover-shadow center-elem"
                        type="submit"
                        name="action"
                        value=""
                    ></button>
                </form>
            </main>

            <div id="footer-container"></div>
        </div>

        <script src="./js/all.js"></script>
        <script src="./js/auth.js"></script>
    </body>
</html>
